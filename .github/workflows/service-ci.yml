# ============================================================
# Service CI/CD (HU-ENA-0-03 · patrón ADR-009)
# ------------------------------------------------------------
# Workflow reutilizable parametrizado por servicio.
# Los callers (uno por servicio) hacen `uses: ./...service-ci.yml`.
# Requiere variables de repositorio:
#   vars.AWS_ROLE_ARN   → rol OIDC (terraform output github_actions_role_arn)
#   vars.AWS_REGION     → región AWS (default us-east-1)
# ============================================================
name: Service CI/CD

on:
  workflow_call:
    inputs:
      servicio:
        description: "Nombre del servicio (carpeta services/<servicio>)"
        type: string
        required: true
      lenguaje:
        description: "Stack del servicio: java | go"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      servicio:
        description: "Servicio a ejecutar"
        type: string
        default: patron
      lenguaje:
        description: "Stack: java | go"
        type: string
        default: go
      image:
        description: "Imagen a escanear cuando no hay código de servicio (validación del fail-gate)"
        type: string
        default: "nginx:alpine"
      deploy_prod:
        description: "Aprobación manual de prod: marca para desplegar a prod tras el deploy dev"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC — cero claves estáticas (CA-07)

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  # floci: emulador AWS local — toda llamada AWS va a localhost:4566
  AWS_ENDPOINT_URL: http://localhost:4566
  SERVICE: ${{ inputs.servicio || 'patron' }}
  LANG: ${{ inputs.lenguaje || 'go' }}
  SERVICE_DIR: services/${{ inputs.servicio || 'patron' }}
  ECR_REPOSITORY: sillalibre/${{ inputs.servicio || 'patron' }}

jobs:
  # --------------------------------------------------------
  # Detección de código del servicio — hashFiles no está
  # permitido en if de job, se resuelve con outputs (CA-08)
  # --------------------------------------------------------
  detect:
    name: Detectar código del servicio
    runs-on: self-hosted
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
      has_dockerfile: ${{ steps.check.outputs.has_dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check código y Dockerfile
        id: check
        run: |
          if [ -n "$(find "$SERVICE_DIR" \( -name '*.go' -o -name '*.java' -o -name 'go.mod' -o -name 'build.gradle*' \) -print -quit 2>/dev/null)" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$SERVICE_DIR/Dockerfile" ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------
  # Tests unitarios (CA-08: si fallan, el check queda failed)
  # --------------------------------------------------------
  tests:
    name: Tests (${{ inputs.lenguaje || 'go' }})
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Java (Gradle + cache) ---
      - name: Setup Java 21 (Gradle cache)
        if: env.LANG == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gradle test
        if: env.LANG == 'java'
        working-directory: ${{ env.SERVICE_DIR }}
        run: ./gradlew test --no-daemon

      # --- Go (module cache) ---
      - name: Setup Go (module cache)
        if: env.LANG == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/*/go.mod

      - name: Go test
        if: env.LANG == 'go'
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...

  # --------------------------------------------------------
  # Build imagen Docker → push a ECR (CA-01)
  # --------------------------------------------------------
  build:
    name: Build & push ECR
    needs: [detect, tests]
    if: needs.detect.outputs.has_dockerfile == 'true' && needs.tests.result == 'success'
    runs-on: self-hosted
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE" "$SERVICE_DIR"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------
  # Seguridad: SBOM + Trivy fail-gate (CA-02, CA-03)
  # El SBOM se genera ANTES del gate para que siempre quede
  # como artifact aunque el scan bloquee.
  # --------------------------------------------------------
  security:
    name: SBOM & Trivy scan
    needs: [detect, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: self-hosted
    env:
      TARGET_IMAGE: ${{ needs.build.outputs.image || inputs.image || 'nginx:alpine' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TARGET_IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.SERVICE }}-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Trivy fail-gate (CRITICAL/HIGH bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.TARGET_IMAGE }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  # --------------------------------------------------------
  # Deploy dev: automático en main, ECS rolling (CA-06)
  # Usa environment `dev` (sin reviewers) con sus vars:
  #   ECS_CLUSTER, ECS_TASK_FAMILY
  # --------------------------------------------------------
  deploy-dev:
    name: Deploy dev (ECS rolling)
    needs: [build, security]
    if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && needs.security.result == 'success'
    runs-on: self-hosted
    environment: dev
    env:
      TARGET_IMAGE: ${{ needs.build.outputs.image || inputs.image || 'nginx:alpine' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_SERVICE: ${{ inputs.servicio || 'patron' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Register task definition con imagen nueva
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > taskdef.json
          jq --arg img "$TARGET_IMAGE" \
            '.containerDefinitions[0].image = $img
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)' \
            taskdef.json > taskdef-new.json
          aws ecs register-task-definition \
            --cli-input-json file://taskdef-new.json

      - name: ECS rolling update
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$ECS_TASK_FAMILY" \
            --force-new-deployment

  # --------------------------------------------------------
  # Deploy prod: aprobación manual = disparo explícito con
  # input deploy_prod=true (limitación plan Free: GitHub no
  # permite required reviewers en environments) — CA-06
  # --------------------------------------------------------
  deploy-prod:
    name: Deploy prod (aprobación manual)
    needs: [build, deploy-dev]
    if: >-
      always() &&
      needs.deploy-dev.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_prod == true
    runs-on: self-hosted
    environment: prod
    env:
      TARGET_IMAGE: ${{ needs.build.outputs.image || inputs.image || 'nginx:alpine' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
      ECS_SERVICE: ${{ inputs.servicio || 'patron' }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Register task definition con imagen nueva
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > taskdef.json
          jq --arg img "$TARGET_IMAGE" \
            '.containerDefinitions[0].image = $img
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)' \
            taskdef.json > taskdef-new.json
          aws ecs register-task-definition \
            --cli-input-json file://taskdef-new.json

      - name: ECS rolling update
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$ECS_TASK_FAMILY" \
            --force-new-deployment
